<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحميل التطبيق</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-container">
    <section class="hero-card">
      <div class="hero-content">
        <div class="logo-box">
          <img src="logo.png" alt="شعار التطبيق" class="app-logo" />
        </div>
        <h1>تطبيقك الاحترافي</h1>
        <p>اكتشف الآن تطبيقنا الذي يقدم تجربة سريعة، تصميم أنيق ووظائف متقدمة.</p>
        <div class="download-group">
          <a href="app.apk" download class="google-play-button">
            <span class="gp-icon">⬇</span>
            <span class="gp-text">
              <strong>حمل ملف</strong>
              <span>APK الآن</span>
            </span>
          </a>
        </div>
        <div class="app-stats">
          <div>
            <strong>4.8</strong>
            <span>تقييم</span>
          </div>
          <div>
            <strong>20K+</strong>
            <span>تحميل</span>
          </div>
          <div>
            <strong>تصميم</strong>
            <span>مهني</span>
          </div>
        </div>
      </div>
    </section>
    <section class="hero-screens-section">
      <h2>لقطات التطبيق</h2>
      <div class="hero-screens">
        <div class="screen-card"><img src="screanshot.jpeg" alt="صورة شاشة التطبيق" /></div>
        <div class="screen-card"><img src="screanshot 2.jpeg" alt="صورة شاشة إضافية" /></div>
        <div class="screen-card"><img src="screanshot3.jpeg" alt="صورة شاشة إضافية" /></div>
        <div class="screen-card"><img src="screanshot4.jpeg" alt="صورة شاشة إضافية" /></div>
        <div class="screen-card"><img src="screanshot5.jpeg" alt="صورة شاشة إضافية" /></div>
        <div class="screen-card"><img src="screanshot6.jpeg" alt="صورة شاشة إضافية" /></div>
        <div class="screen-card"><img src="screanshot7.jpeg" alt="صورة شاشة إضافية" /></div>
        <div class="screen-card"><img src="screanshot8.jpeg" alt="صورة شاشة إضافية" /></div>
      </div>
    </section>
  </main>
</body>
</html>
